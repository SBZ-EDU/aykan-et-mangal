name: Deploy Workers (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Which worker to deploy? (deploys to BOTH accounts)'
        type: choice
        required: true
        default: all
        options: [app, panel, all]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets into placeholders
        env:
          HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
          PANEL_SECRET: ${{ secrets.PANEL_SECRET }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          WA_VERIFY: ${{ secrets.WA_VERIFY }}
        run: |
          for v in HOOK_SECRET PANEL_SECRET ADMIN_PIN WA_VERIFY; do
            if [ -z "${!v}" ]; then echo "ERROR: GitHub secret $v is not set"; exit 1; fi
          done
          find deploy -type f \( -name '*.js' -o -name '*.toml' \) -print0 | xargs -0 sed -i \
            -e "s/__HOOK_SECRET__/$HOOK_SECRET/g" \
            -e "s/__PANEL_SECRET__/$PANEL_SECRET/g" \
            -e "s/__ADMIN_PIN__/$ADMIN_PIN/g" \
            -e "s/__WA_VERIFY__/$WA_VERIFY/g"

      - name: Select workers
        id: sel
        run: |
          W="${{ inputs.worker }}"
          if [ "$W" = "all" ]; then echo "list=app panel" >> $GITHUB_OUTPUT; else echo "list=$W" >> $GITHUB_OUTPUT; fi

      - name: Build site assets (bot + site = ONE worker)
        if: ${{ inputs.worker == 'app' || inputs.worker == 'all' }}
        run: |
          mkdir -p deploy/app/public/brosur
          cp index.html robots.txt sitemap.xml manifest.json 404.html aykan.vcf deploy/app/public/
          cp -r assets deploy/app/public/
          cp brosur/aykan_fiyat_brosuru_baski.pdf brosur/aykan_fiyat_brosuru_preview.png deploy/app/public/brosur/

      - name: Deploy NEW account (aykanet34 — primary)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          for w in ${{ steps.sel.outputs.list }}; do
            (cd "deploy/$w" && npx -y wrangler@3.100.0 deploy) || exit 1
            sleep 20
          done

      - name: Build OLD variants (elasa2next)
        run: |
          for w in ${{ steps.sel.outputs.list }}; do
            dst="/tmp/old/$w"; mkdir -p "$dst"
            cp -r "deploy/$w"/. "$dst"/
            find "$dst" -type f \( -name '*.js' -o -name '*.toml' -o -name '*.html' -o -name '*.vcf' -o -name '*.txt' -o -name '*.xml' -o -name '*.json' \) -print0 | xargs -0 sed -i \
              -e 's/aykanet34\.workers\.dev/elasa2next.workers.dev/g' \
              -e 's/058e06bb-6148-4c5b-ba34-e1321bb9ac7c/2917135d-d1e4-4486-a826-286572bbef9a/g'
          done

      - name: Deploy OLD account (elasa2next — standby)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_OLD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID_OLD }}
        run: |
          for w in ${{ steps.sel.outputs.list }}; do
            (cd "/tmp/old/$w" && npx -y wrangler@3.100.0 deploy) || exit 1
            sleep 20
          done
